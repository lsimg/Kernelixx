name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[onnx,dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/package_source.py
      - name: Install built wheel
        run: python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--no-deps','--force-reinstall',str(wheel)])"
      - name: Check installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/tools/smoke_installed.py" --output installed-wheel-smoke
